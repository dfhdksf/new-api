root = "."
tmp_dir = "tmp"

[build]
cmd = "make --no-print-directory air-build"
bin = "./tmp/new-api"
full_bin = "./tmp/new-api"
include_ext = ["go", "tpl", "tmpl", "html", "md", "ts", "tsx", "js", "mjs", "css", "json", "png", "jpg", "jpeg", "gif", "webp", "svg", "ico", "txt", "pdf", "lock"]
exclude_dir = ["assets", "tmp", "vendor", "web/node_modules", "web/dist", "logs", "data"]
exclude_regex = ["_test\\.go$"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = false

[misc]
clean_on_exit = true
